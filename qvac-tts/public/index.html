<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QVAC Text-to-Speech</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --border: #262b33;
    --text: #e8eaed;
    --muted: #9aa1ab;
    --accent: #22c55e;
    --accent-dim: #16341f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 20px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .badge {
    font-size: 12px;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  p.sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent);
    color: #06210f;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 18px; }
  audio { width: 100%; margin-top: 16px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>QVAC Text-to-Speech <span class="badge">runs 100% on-device</span></h1>
  <p class="sub">Speech synthesis via Tether's QVAC SDK — loadModel() + textToSpeech(), no cloud call.</p>

  <div class="panel">
    <textarea id="textInput" placeholder="Type something to hear it spoken on-device...">Hello! This voice is being generated entirely on your own device.</textarea>
    <button id="speakBtn">Speak on-device</button>
    <div class="status" id="status"></div>
    <audio id="player" controls></audio>
  </div>
</div>

<script>
  const textInput = document.getElementById("textInput");
  const speakBtn = document.getElementById("speakBtn");
  const statusEl = document.getElementById("status");
  const player = document.getElementById("player");

  speakBtn.addEventListener("click", async () => {
    const text = textInput.value.trim();
    if (!text) return;

    speakBtn.disabled = true;
    statusEl.textContent = "Loading model on-device and generating speech — this can take a moment on first run...";
    player.style.display = "none";

    try {
      const res = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Text-to-speech failed.");
      }

      const blob = await res.blob();
      player.src = URL.createObjectURL(blob);
      player.style.display = "block";
      player.play();
      statusEl.textContent = "✓ Done — playing audio.";
    } catch (err) {
      statusEl.textContent = "❌ " + err.message;
    } finally {
      speakBtn.disabled = false;
    }
  });
</script>
</body>
</html>
